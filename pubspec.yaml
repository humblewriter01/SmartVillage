name: smart_village
description: Offline-first crop and health assistant for rural Nigerian communities.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  path_provider: ^2.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/crop/kisandoc.tflite
    - assets/models/crop/labels.txt
    - assets/models/health/health_model.tflite
    - assets/knowledge/crop_kb.jsonl
    - assets/knowledge/disease_data.json

flutter_intl:
  enabled: false
