workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2 # Or your preferred machine type
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
