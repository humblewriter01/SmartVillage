workflows:
  android-release:
    name: SmartVillage Android Production Release (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_ndk: default
      java: 17
      node: 20
      groups:
        - google_play # Set up in Codemagic UI if publishing automatically to Google Play
      vars:
        PACKAGE_NAME: "com.smartvillage.app"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'release/*'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build Web Frontend (React + Vite)
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Android Release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Build Android App Bundle (AAB for Google Play)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - dist/**
    publishing:
      email:
        recipients:
          - ameenujaafar432@gmail.com
        notify:
          success: true
          failure: true

  web-production:
    name: SmartVillage Web Release
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build Web Frontend Assets
        script: |
          npm run build
    artifacts:
      - dist/**
    publishing:
      email:
        recipients:
          - ameenujaafar432@gmail.com
        notify:
          success: true
          failure: true
