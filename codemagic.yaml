workflows:
  android-release:
    name: SmartVillage Android Production Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build Web Frontend (React + Vite)
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Android Release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - dist/**
    publishing:
      email:
        recipients:
          - ameenujaafar432@gmail.com
        notify:
          success: true
          failure: true

  web-production:
    name: SmartVillage Web Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build Web Frontend Assets
        script: |
          npm run build
    artifacts:
      - dist/**
