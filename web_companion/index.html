<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f7a4c"><title>SmartVillage</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5faf7;color:#173326}main{max-width:900px;margin:auto;padding:28px}header{background:#1f7a4c;color:#fff;border-radius:22px;padding:26px}h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px #143c2020}.tag{color:#1f7a4c;font-weight:700}.health{color:#b33b3b}.toolbar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}input,select{padding:12px;border:1px solid #cfe2d5;border-radius:12px;font-size:16px;flex:1}small{color:#55705f}a{color:inherit}</style></head><body><main><header><h1>SmartVillage</h1><div>Offline-first crop and health guidance for Nigeria</div><div class="toolbar"><input id="q" placeholder="Search crops or health topics"><select id="type"><option value="all">All guidance</option><option value="crop">Crops</option><option value="health">Health topics</option></select></div></header><section id="cards" class="grid"></section><p><small>This browser companion provides verified educational guidance. It does not diagnose illness, replace a clinician, or replace agricultural extension advice. The Android app provides native camera, SQLite, TFLite, and voice features.</small></p></main><script>const data={crops:[{n:'Cassava',h:'Rogo',g:'Use clean planting material and inspect for cassava mosaic and bacterial blight symptoms. Consult an extension worker before treatment.',s:'FAO/IITA'},{n:'Maize',h:'Masara',g:'Monitor leaves and cobs for insect damage, leaf spots, stalk problems, and mould. Use integrated pest management and safe storage.',s:'FAO'},{n:'Sorghum',h:'Dawa',g:'Use adapted varieties, field sanitation, and monitoring for insect and fungal disease symptoms.',s:'FAO'},{n:'Cowpea',h:'Wake',g:'Use resistant varieties, clean seed, rotation, and integrated pest management. Follow approved product labels.',s:'IITA'},{n:'Rice',h:'Shinkafa',g:'Use clean seed, balanced nutrition, spacing, and monitoring for blast and bacterial leaf blight.',s:'FAO'},{n:'Yam',h:'Doya',g:'Select healthy seed yam, avoid damaged setts, and use clean tools.',s:'FAO'},{n:'Millet',h:'Gero',g:'Use adapted varieties, field sanitation, and approved control measures for downy mildew and smut.',s:'FAO'}],health:[{n:'Malaria warning signs',g:'Fever, chills, and headache are not specific. Confusion, convulsions, breathing difficulty, dark urine, jaundice, or abnormal bleeding require emergency care.',s:'WHO'},{n:'Anaemia',g:'Tiredness, weakness, dizziness, and shortness of breath need clinical testing to confirm anaemia and its cause.',s:'WHO'},{n:'Tuberculosis',g:'Persistent cough, fever, night sweats, weight loss, or coughing blood require assessment at a health facility.',s:'WHO'},{n:'Cholera and acute diarrhoea',g:'Repeated watery diarrhoea can cause rapid dehydration. Seek urgent care for severe dehydration or inability to drink.',s:'WHO'},{n:'Meningitis danger signs',g:'Severe headache, fever, neck stiffness, confusion, seizures, or rapid worsening require emergency assessment.',s:'WHO'},{n:'Jaundice',g:'Yellowing of the eyes or skin has several causes and needs prompt clinical assessment.',s:'WHO'},{n:'Diabetes risk',g:'Increased thirst, frequent urination, unexplained weight loss, or blurred vision need clinical testing.',s:'WHO'},{n:'Skin concern',g:'Keep affected skin clean and dry. Seek care for spreading redness, pus, severe pain, fever, or eye involvement.',s:'WHO'}]};function render(){const q=document.querySelector('#q').value.toLowerCase(),t=document.querySelector('#type').value;const rows=[...(t==='all'||t==='crop'?data.crops.map(x=>({...x,t:'crop'})):[]),...(t==='all'||t==='health'?data.health.map(x=>({...x,t:'health'})):[])].filter(x=>(x.n+' '+x.h+' '+x.g).toLowerCase().includes(q));document.querySelector('#cards').innerHTML=rows.map(x=>`<article class="card"><div class="${x.t==='health'?'health':'tag'}">${x.t==='health'?'Health':'Crop'}</div><h2>${x.n}</h2>${x.h?`<small>Hausa: ${x.h}</small>`:''}<p>${x.g}</p><small>Source basis: ${x.s}</small></article>`).join('')||'<p>No matching guidance.</p>'}document.querySelector('#q').oninput=render;document.querySelector('#type').onchange=render;render();</script></body></html>
